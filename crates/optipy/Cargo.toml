[package]
name = "optipy"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
readme = "README.md"
categories = ["development-tools::ffi"]
keywords = ["python", "pyo3", "ffi"]
description = "Macro for stripping PyO3-related attributes when using features."
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", features = [ "full", "visit-mut" ] }


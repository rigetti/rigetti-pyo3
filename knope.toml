[packages.rigetti-pyo3]
versioned_files = ["crates/rigetti-pyo3/Cargo.toml", "Cargo.lock"]
changelog = "crates/rigetti-pyo3/CHANGELOG.md"
scopes = ["rigetti-pyo3"]

[packages.optipy]
versioned_files = [
    "crates/optipy/Cargo.toml",
    "Cargo.lock",
    { path = "Cargo.toml", dependency = "optipy" },
]
changelog = "crates/optipy/CHANGELOG.md"
scopes = ["optipy"]

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release [skip ci]\""

[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"

[github]
owner = "rigetti"
repo = "rigetti-pyo3"

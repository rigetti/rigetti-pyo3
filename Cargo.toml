[workspace]
members = ["crates/*", "crates/opentelemetry/examples/pyo3-opentelemetry-lib"]
resolver = "3"

[workspace.package]
authors = ["Rigetti QPU Software <qpu-software@rigetti.com>"]
edition = "2024"
repository = "https://github.com/rigetti/rigetti-pyo3"
publish = true
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
optipy = { path = "crates/optipy", version = "0.2.0" }
rigetti-pyo3 = { path = "crates/rigetti-pyo3", version = "0.8.0" }
pyo3-opentelemetry = { path = "crates/opentelemetry", version = "0.9.0" }
pyo3-opentelemetry-macros = { path = "crates/opentelemetry-macros", version = "0.9.0" }
pyo3-tracing-subscriber = { path = "crates/tracing-subscriber", default-features = false, version = "0.7.0" }
pyo3-tracing-subscriber-build = { path = "crates/tracing-subscriber-build", default-features = false, version = "0.7.0" }

# The `pyo3` and OpenTelemetry dependency trees are linked: `pyo3-async-runtimes` must
# match the `pyo3` ABI, and the `tracing`/`tracing-subscriber`/OTel crates must resolve
# to a single compatible set (enforced by `deny-multiple-versions` in `deny.toml`).
# Bump these together, not individually.
pyo3 = { version = "0.29", features = ["macros"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-build-config = "0.29"
qcs-dependencies-client = { version = "0.5" }
rstest = "0.17.0"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.17"
tokio = { version = "1.36.0", features = [] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"

futures-core = "0.3.30"
futures-util = "0.3.31"
handlebars = "6.4.0"
once_cell = "1.17.1"
proc-macro2 = "1.0.58"
quote = "1.0.26"
syn = "2.0.14"

[patch.crates-io]
qcs-dependencies-client = { path = "/Users/kstrand/workspace/qcs-core-dependencies/client" }

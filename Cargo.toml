[workspace]
members = ["crates/*", "crates/opentelemetry/examples/pyo3-opentelemetry-lib"]
resolver = "3"

[workspace.package]
authors = ["Rigetti QPU Software <qpu-software@rigetti.com>"]
edition = "2024"
repository = "https://github.com/rigetti/rigetti-pyo3"
publish = true
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
optipy = { path = "crates/optipy", version = "0.2.1" }
rigetti-pyo3 = { path = "crates/rigetti-pyo3", version = "0.8.2-kjs.0" }
pyo3-opentelemetry = { path = "crates/opentelemetry", version = "0.11.0" }
pyo3-opentelemetry-macros = { path = "crates/opentelemetry-macros", version = "0.11.0" }
pyo3-tracing-subscriber = { path = "crates/tracing-subscriber", default-features = false, version = "0.9.0" }
pyo3-tracing-subscriber-build = { path = "crates/tracing-subscriber-build", default-features = false, version = "0.9.0" }

# The `pyo3` and OpenTelemetry dependency trees are linked: `pyo3-async-runtimes` must
# match the `pyo3` ABI, and the `tracing`/`tracing-subscriber`/OTel crates must resolve
# to a single compatible set (enforced by `deny-multiple-versions` in `deny.toml`).
# Bump these together, not individually.
pyo3 = { version = "0.29", features = ["macros"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-build-config = "0.29"
pyo3-stub-gen = "0.23.0"
qcs-dependencies-client = { version = "0.5" }
rstest = "0.17.0"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.17"
tokio = { version = "1.36.0", features = [] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"

futures-core = "0.3.30"
futures-util = "0.3.31"
handlebars = "6.4.0"
indexmap = "2.2.6"
itertools = "0.14.0"
once_cell = "1.17.1"
pastey = "0.2"
proc-macro2 = "1.0.58"
quote = "1.0.26"
syn = "2.0.14"

[workspace.lints.clippy]
# Covers correctness, suspicious, style, complexity, and perf
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Has false positives that conflict with unreachable_pub
redundant_pub_crate = "allow"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
anonymous_parameters = "deny"
bad_style = "deny"
dead_code = "deny"
keyword_idents = "deny"
improper_ctypes = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny" # May have false positives
missing_abi = "deny"
missing_debug_implementations = "deny" # can affect compile time/code size
missing_docs = "deny"
no_mangle_generic_items = "deny"
non_shorthand_field_patterns = "deny"
noop_method_call = "deny"
overflowing_literals = "deny"
path_statements = "deny"
patterns_in_fns_without_body = "deny"
private_interfaces = "deny"
private_bounds = "deny"
semicolon_in_expressions_from_macros = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unconditional_recursion = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
unused_allocation = "deny"
unused_comparisons = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_parens = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"
while_true = "deny"


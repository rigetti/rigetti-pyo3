name: Publish Crates

on:
  release:
    types: [published]

concurrency:
  # Collapse simultaneous tag-triggered runs for the same commit into one pipeline.
  group: publish-crates-${{ github.sha }}
  cancel-in-progress: true

jobs:
  determine-targets:
    runs-on: ubuntu-latest
    outputs:
      publish_optipy: ${{ steps.targets.outputs.publish_optipy }}
      publish_rigetti_pyo3: ${{ steps.targets.outputs.publish_rigetti_pyo3 }}
      publish_opentelemetry_macros: ${{ steps.targets.outputs.publish_opentelemetry_macros }}
      publish_opentelemetry: ${{ steps.targets.outputs.publish_opentelemetry }}
      publish_tracing_subscriber: ${{ steps.targets.outputs.publish_tracing_subscriber }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: targets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          publish_optipy=false
          publish_rigetti_pyo3=false
          publish_opentelemetry_macros=false
          publish_opentelemetry=false
          publish_tracing_subscriber=false

          # Start with the triggering release tag.
          if [[ "$RELEASE_TAG" == optipy/v* ]]; then
            publish_optipy=true
          fi
          if [[ "$RELEASE_TAG" == rigetti-pyo3/v* ]]; then
            publish_rigetti_pyo3=true
          fi
          if [[ "$RELEASE_TAG" == opentelemetry-macros/v* ]]; then
            publish_opentelemetry_macros=true
          fi
          if [[ "$RELEASE_TAG" == opentelemetry/v* ]]; then
            publish_opentelemetry=true
          fi
          if [[ "$RELEASE_TAG" == tracing-subscriber/v* ]]; then
            publish_tracing_subscriber=true
          fi

          # Also detect sibling package tags pointing to the same commit.
          tags_at_sha="$(git tag --points-at "$GITHUB_SHA" || true)"
          if echo "$tags_at_sha" | grep -Eq '^optipy/v'; then
            publish_optipy=true
          fi
          if echo "$tags_at_sha" | grep -Eq '^rigetti-pyo3/v'; then
            publish_rigetti_pyo3=true
          fi
          if echo "$tags_at_sha" | grep -Eq '^opentelemetry-macros/v'; then
            publish_opentelemetry_macros=true
          fi
          if echo "$tags_at_sha" | grep -Eq '^opentelemetry/v'; then
            publish_opentelemetry=true
          fi
          if echo "$tags_at_sha" | grep -Eq '^tracing-subscriber/v'; then
            publish_tracing_subscriber=true
          fi

          echo "publish_optipy=$publish_optipy" >> "$GITHUB_OUTPUT"
          echo "publish_rigetti_pyo3=$publish_rigetti_pyo3" >> "$GITHUB_OUTPUT"
          echo "publish_opentelemetry_macros=$publish_opentelemetry_macros" >> "$GITHUB_OUTPUT"
          echo "publish_opentelemetry=$publish_opentelemetry" >> "$GITHUB_OUTPUT"
          echo "publish_tracing_subscriber=$publish_tracing_subscriber" >> "$GITHUB_OUTPUT"

  publish-optipy:
    needs: [determine-targets]
    if: ${{ needs.determine-targets.outputs.publish_optipy == 'true' }}
    runs-on: ubuntu-latest
    name: Publish optipy
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail

          crate="optipy"
          version="$(cargo pkgid -p "$crate" | sed -E "s|.*#${crate}:||")"

          cargo publish -p "$crate" --locked --token "${{ secrets.CRATES_IO_TOKEN }}"

  publish-rigetti-pyo3:
    needs: [determine-targets, publish-optipy]
    # Evaluate dependency result even when optipy job is skipped.
    if: |
      !cancelled() &&
      needs.determine-targets.outputs.publish_rigetti_pyo3 == 'true' &&
      (needs.publish-optipy.result == 'success' || needs.publish-optipy.result == 'skipped')

    runs-on: ubuntu-latest
    name: Publish rigetti-pyo3
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail

          crate="rigetti-pyo3"
          version="$(cargo pkgid -p "$crate" | sed -E "s|.*#${crate}:||")"

          cargo publish -p "$crate" --locked --token "${{ secrets.CRATES_IO_TOKEN }}"

  publish-opentelemetry-macros:
    needs: [determine-targets]
    if: ${{ needs.determine-targets.outputs.publish_opentelemetry_macros == 'true' }}
    runs-on: ubuntu-latest
    name: Publish pyo3-opentelemetry-macros
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail

          crate="pyo3-opentelemetry-macros"
          version="$(cargo pkgid -p "$crate" | sed -E "s|.*#${crate}:||")"

          cargo publish -p "$crate" --locked --token "${{ secrets.CRATES_IO_TOKEN }}"

  publish-opentelemetry:
    needs: [determine-targets, publish-opentelemetry-macros]
    # `pyo3-opentelemetry` depends on `pyo3-opentelemetry-macros`; evaluate the
    # dependency result even when that job is skipped (i.e. not part of this release).
    if: |
      !cancelled() &&
      needs.determine-targets.outputs.publish_opentelemetry == 'true' &&
      (needs.publish-opentelemetry-macros.result == 'success' || needs.publish-opentelemetry-macros.result == 'skipped')
    runs-on: ubuntu-latest
    name: Publish pyo3-opentelemetry
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail

          crate="pyo3-opentelemetry"
          version="$(cargo pkgid -p "$crate" | sed -E "s|.*#${crate}:||")"

          cargo publish -p "$crate" --locked --token "${{ secrets.CRATES_IO_TOKEN }}"

  publish-tracing-subscriber:
    needs: [determine-targets, publish-rigetti-pyo3]
    # `pyo3-tracing-subscriber` depends on `rigetti-pyo3`; evaluate the dependency
    # result even when that job is skipped (i.e. not part of this release).
    if: |
      !cancelled() &&
      needs.determine-targets.outputs.publish_tracing_subscriber == 'true' &&
      (needs.publish-rigetti-pyo3.result == 'success' || needs.publish-rigetti-pyo3.result == 'skipped')
    runs-on: ubuntu-latest
    name: Publish pyo3-tracing-subscriber(-build)
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail

          # `pyo3-tracing-subscriber-build` is released together with
          # `pyo3-tracing-subscriber` as a single Knope package.
          for crate in pyo3-tracing-subscriber-build pyo3-tracing-subscriber; do
            cargo publish -p "$crate" --locked --token "${{ secrets.CRATES_IO_TOKEN }}"
          done

name: Rust Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-make

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run cargo deny
        run: cargo make deny

      - name: Run Clippy
        run: cargo make clippy

  deadlinks:
    name: Cargo Deadlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-make
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deadlinks
      - run: cargo make deadlinks

  msrv:
    name: Cargo MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-make
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - run: cargo make msrv-verify

  python-checks:
    name: Python Example Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-make

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        uses: abatilo/actions-poetry@v4

      - name: Configure Python Cache
        uses: actions/cache@v4
        with:
          path: ".venv"
          key: ${{ runner.os }}-${{ matrix.python-version }}-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Run Python Example Checks
        run: cargo make --cwd crates/opentelemetry/examples/pyo3-opentelemetry-lib python-check-all

  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-make
      - run: cargo make test

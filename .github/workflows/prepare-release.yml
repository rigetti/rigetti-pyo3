name: Prepare Release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: "Prerelease label. Leave empty for a full release on main; defaults to 'rc' on other refs."
        required: false
        default: ""

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.PAT }}
      - uses: Swatinem/rust-cache@v2

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.triggering_actor }}"
          git config --global user.email "${{ github.triggering_actor}}@users.noreply.github.com"

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0 # Test before updating, breaking changes likely: https://github.com/knope-dev/action#install-latest-version

      - name: Dry-run Release
        run: knope release --verbose --dry-run
        if: github.event_name == 'pull_request'

      - name: Run Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          PRERELEASE_LABEL: ${{ inputs.prerelease-label }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -n "$PRERELEASE_LABEL" ]]; then
              echo "Running prerelease for main with label '$PRERELEASE_LABEL'"
              knope release --verbose "--prerelease-label=$PRERELEASE_LABEL"
            else
              echo "Running full release for main"
              knope release --verbose
            fi
          else
            label="${PRERELEASE_LABEL:-rc}"
            echo "Running prerelease for non-main ref with label '$label'"
            knope release --verbose "--prerelease-label=$label"
          fi
